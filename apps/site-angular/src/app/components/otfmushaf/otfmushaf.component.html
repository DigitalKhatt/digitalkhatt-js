<div [hidden]="hideElement" class="qurancontainer">
  <div *ngIf="!loaded || fontLoadError" class="font-status" role="status">
    <strong>{{fontLoadError || 'Loading font…'}}</strong>
  </div>
  <mat-toolbar *ngIf="loaded">
    <div class="leftnav">
      <button mat-icon-button class="hamburger" (click)="sidenav.toggle()" title="Surahs menu">
        <mat-icon class="menicon" svgIcon="menu"></mat-icon>
      </button>
    </div>
    <div class="centernav">
      <div style="color:black;display: flex;flex-direction: row;align-items: center;">
        <div style="box-sizing:border-box;display: flex;flex-direction: row;align-items: center;margin-right:10px;"
             class="hiddenSmallView hiddenMediumView">
          <button type="button" [disabled]="currentPageNumber === 1" (click)="navigateTo('first')" mat-mini-fab style="margin-right:8px" class="small-icon-button"><mat-icon>first_page</mat-icon></button>
          <button type="button" [disabled]="currentPageNumber === 1" (click)="navigateTo('prev')" mat-mini-fab style="margin-right:8px" class="small-icon-button"><mat-icon>chevron_left</mat-icon></button>
          <button type="button" [disabled]="currentPageNumber === totalPages" (click)="navigateTo('next')" mat-mini-fab style="margin-right: 8px" class="small-icon-button"><mat-icon>chevron_right</mat-icon></button>
          <button type="button" [disabled]="currentPageNumber === totalPages" (click)="navigateTo('last')" mat-mini-fab class="small-icon-button"><mat-icon>last_page</mat-icon></button>
        </div>
        <mat-form-field style="width:70px;font-size:small;margin-right:10px;" subscriptSizing="dynamic" class="pagenumber">
          <input matInput [formControl]="form.controls['currentPageNumber']" (blur)="updatePageNumber($event)" (keydown.enter)="updatePageNumber($event)" style="color:black">
          <span matSuffix style="padding-right:5px;">/ {{totalPages}}</span>
        </mat-form-field>
      </div>
      <form [formGroup]="form" style="color:black;display: flex;flex-direction: row;align-items: center;">
        <button type="button" class="small-icon-button zoom-button" mat-mini-fab aria-label="Zoom out" (click)="zoomOut()" style="margin-right: 8px">
          <mat-icon>remove</mat-icon>
        </button>
        <button type="button" class="small-icon-button zoom-button" mat-mini-fab aria-label="Zoom in" (click)="zoomIn()" style="margin-right:20px;">
          <mat-icon>add</mat-icon>
        </button>

        <mat-select disableOptionCentering class="zoom-select" panelClass="mypanelclass" [formControl]="zoomCtrl" style="font-size: small; width: 130px;margin-right:20px; ">
          <mat-option style="display:none;" value="custom">{{(scale * 100) | number:'1.0-0'  }} %</mat-option>
          <mat-option value="page-actual" style="font-size: small;min-height:30px"><span>Actual Size</span></mat-option>
          <mat-option value="page-fit" style="font-size: small;min-height:30px"><span>Page Fit</span></mat-option>
          <mat-option value="page-width" style="font-size: small;min-height:30px"><span>Page Width</span></mat-option>
          <mat-divider></mat-divider>
          <mat-option *ngFor="let zoom of zooms" [value]="zoom.value" style="font-size: small;min-height:30px">
            <span>{{zoom.value * 100}} %</span>
          </mat-option>
        </mat-select>

        <mat-slider class="fontsize hiddenSmallView" min="0.5" max="1.2" step="0.01"
                    discrete [displayWith]="formatLabel">
          <input matSliderThumb #ngSliderThumb="matSliderThumb" [formControl]="fontScaleCtrl" name="fontScale" aria-label="Font size" (change)="fontSizeChanged()"/>
        </mat-slider>
        <div class="weight-control">
          <label for="opentype-weight">Weight</label>
          <mat-slider min="400" max="700" step="1" discrete>
            <input matSliderThumb id="opentype-weight" [formControl]="fontWeight">
          </mat-slider>
          <output for="opentype-weight">{{fontWeight.value}}</output>
        </div>
      </form>
    </div>
    <div class="rightnav">
      <form style="color:black;display: flex;flex-direction: row;align-items: center;">

        <button *ngIf="debug" mat-icon-button [matMenuTriggerFor]="menu" title="Debug">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item type="button" (click)="saveTajweed()">Save Tajweed</button>
          <a mat-menu-item routerLink="/hb/indopak15">HarfBuzz IndoPak</a>
        </mat-menu>
        <app-mushaf-selector [mushafType]="mushafType" (mushafSelected)="selectMushaf($event)"></app-mushaf-selector>
        <button mat-icon-button (click)="toggleFullScreen()" title="Fullscreen">
          <mat-icon>fullscreen</mat-icon>
        </button>
        <button mat-icon-button [routerLink]='["/about"]' title="About">
          <mat-icon>info</mat-icon>
        </button>
        <a mat-icon-button class="hiddenSmallView" href="https://twitter.com/DigitalKhatt" title="Twitter" aria-label="DigitalKhatt on twitter">
          <mat-icon svgIcon="logos:twitter"></mat-icon>
        </a>
        <a mat-icon-button class="hiddenSmallView" href="https://github.com/DigitalKhatt" title="GitHub" aria-label="DigitalKhatt on github">
          <mat-icon svgIcon="logos:github"></mat-icon>
        </a>

      </form>

    </div>
  </mat-toolbar>
  <mat-sidenav-container class="sidenav-container" [class.has-floating-toc]="hasFloatingToc"
                         role="main" style="height:100% !important;background-color:white;">

    <mat-sidenav [ngClass]="{'collapsed': !isSideBySide}" #sidenav class="sidenav" [mode]="mode" [opened]="isOpened" (openedChange)="updateHostClasses()">
      <app-mushaf-sidebar [outline]="outline" [fontFamily]="fontFamily" (outlineSelected)="setOutline($event)"></app-mushaf-sidebar>
    </mat-sidenav>
    <mat-sidenav-content>
      <app-page-number-box [loaded]="loaded" [pageNumber]="currentPageNumber"></app-page-number-box>

      <div #viewerContainer id="viewerContainer" cdkScrollable [style.visibility]="loaded ? 'visible' : 'hidden'">
        <div #book id="viewer" class="pdfViewer" lang="ar" [style.font-family]="fontFamily">
          <div #page *ngFor="let page of pages; let index = index; trackBy: trackByIndex" class="page" data-loaded="false" [hidden]="index >= totalPages"></div>
        </div>
      </div>

    </mat-sidenav-content>


  </mat-sidenav-container>
</div>
<router-outlet></router-outlet>
