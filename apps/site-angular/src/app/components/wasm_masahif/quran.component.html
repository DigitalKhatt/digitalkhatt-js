<div [hidden]="hideElement" style="height:100%" class="qurancontainer">
  <canvas #testcanvas style="display:none"></canvas>
  <div *ngIf="!loaded" style="height:100%">
    <img class="imgcenter"
         src="assets/digitalkhatt-logo.svg"
         alt="Quran">
    <div style="margin: 0 auto;display: block;text-align:center;margin-top:10px;">
      <strong>{{wasmStatus}}</strong>
      <br />
      <span *ngIf="loading"><strong>Please wait, this might take a few minutes.</strong></span>

    </div>
  </div>
  <mat-toolbar *ngIf="loaded">
    <div class="leftnav">
      <button mat-icon-button class="hamburger" (click)="sidenav.toggle()" title="Surahs menu">
        <mat-icon class="menicon" svgIcon="menu"></mat-icon>
      </button>
    </div>
    <div class="centernav">
      <div style="color:black;display: flex;flex-direction: row;align-items: center;">
        <div style="box-sizing:border-box;display: flex;flex-direction: row;align-items: center;margin-right:10px;"
             class="hiddenSmallView hiddenMediumView">
          <button type="button" [disabled]="currentPageNumber === 1" (click)="navigateTo('first')" mat-mini-fab style="margin-right:8px" class="small-icon-button"><mat-icon>first_page</mat-icon></button>
          <button type="button" [disabled]="currentPageNumber === 1" (click)="navigateTo('prev')" mat-mini-fab style="margin-right:8px" class="small-icon-button"><mat-icon>chevron_left</mat-icon></button>
          <button type="button" [disabled]="currentPageNumber === totalPages" (click)="navigateTo('next')" mat-mini-fab style="margin-right: 8px" class="small-icon-button"><mat-icon>chevron_right</mat-icon></button>
          <button type="button" [disabled]="currentPageNumber === totalPages" (click)="navigateTo('last')" mat-mini-fab class="small-icon-button"><mat-icon>last_page</mat-icon></button>
        </div>
        <mat-form-field style="width:70px;font-size:small;margin-right:10px;" subscriptSizing="dynamic" class="pagenumber">
          <input matInput [formControl]="form.controls['currentPageNumber']" (blur)="updatePageNumber($event)" (keydown.enter)="updatePageNumber($event)" style="color:black">
          <span matSuffix style="padding-right:5px;">/ {{totalPages}}</span>
        </mat-form-field>
      </div>
      <form [formGroup]="form" style="color:black;display: flex;flex-direction: row;align-items: center;">
        <button class="small-icon-button" mat-mini-fab (click)="zoomOut()" style="margin-right: 8px">
          <mat-icon>remove</mat-icon>
        </button>
        <button class="small-icon-button" mat-mini-fab (click)="zoomIn()" style="margin-right:20px;">
          <mat-icon>add</mat-icon>
        </button>

        <mat-select disableOptionCentering panelClass="mypanelclass" [formControl]="zoomCtrl" style="font-size: small; width: 130px;margin-right:20px; ">
          <mat-option style="display:none;" value="custom">{{(scale * 100) | number:'1.0-0'  }} %</mat-option>
          <mat-option value="page-actual" style="font-size: small;min-height:30px"><span>Actual Size</span></mat-option>
          <mat-option value="page-fit" style="font-size: small;min-height:30px"><span>Page Fit</span></mat-option>
          <mat-option value="page-width" style="font-size: small;min-height:30px"><span>Page Width</span></mat-option>
          <mat-divider></mat-divider>
          <mat-option *ngFor="let zoom of zooms" [value]="zoom.value" style="font-size: small;min-height:30px">
            <span>{{zoom.value * 100}} %</span>
          </mat-option>
        </mat-select>

        <mat-slider class="hiddenSmallView fontsize" min="0.5" max="1.2" step="0.01"
                    thumbLabel [displayWith]="formatLabel" #ngSlider>
          <input matSliderThumb #ngSliderThumb="matSliderThumb" [formControl]="fontScaleCtrl" name="fontScale" (dragEnd)="fontSizeChanged()"/>
        </mat-slider>
      </form>
    </div>
    <div class="rightnav">
      <form style="color:black;display: flex;flex-direction: row;align-items: center;">

        <button *ngIf="debug" mat-icon-button [matMenuTriggerFor]="menu" title="Format">
          <mat-icon>text_format</mat-icon>
        </button>
        <mat-menu *ngIf="debug" #menu="matMenu" class="panelClass">
          <div mat-menu-item>
            <mat-icon>invert_colors</mat-icon>
            <mat-slide-toggle [formControl]="tajweedColorCtrl">Tajweed Color</mat-slide-toggle>
          </div>
          <div mat-menu-item>
            <mat-icon>auto_fix_high</mat-icon>
            <mat-slide-toggle [formControl]="applyForceCtrl">Optimize marks</mat-slide-toggle>
          </div>
          <button mat-menu-item type="button" (click)="navigateToMushaf(3)">IndoPak15</button>
        </mat-menu>
        <button mat-icon-button [routerLink]='["/about"]' title="About">
          <mat-icon>info</mat-icon>
        </button>
        <a mat-icon-button href="https://twitter.com/DigitalKhatt" title="Twitter" aria-label="DigitalKhatt on twitter">
          <mat-icon svgIcon="logos:twitter"></mat-icon>
        </a>
        <a mat-icon-button href="https://github.com/DigitalKhatt" title="GitHub" aria-label="DigitalKhatt on github">
          <mat-icon svgIcon="logos:github"></mat-icon>
        </a>

      </form>

    </div>
  </mat-toolbar>
  <mat-sidenav-container class="sidenav-container" [class.has-floating-toc]="hasFloatingToc"
                         role="main" style="height:100% !important;background-color:white;">

    <mat-sidenav [ngClass]="{'collapsed': !isSideBySide}" #sidenav class="sidenav" [mode]="mode" [opened]="isOpened" (openedChange)="updateHostClasses()">
      <div style="width: 100%; padding: 0px; box-sizing: border-box; display: flex; flex-direction: column; height: 100%;">
        <mat-card appearance="outlined" style="overflow: auto; " mat-elevation-z8>

          <div *ngFor="let item of outline">
            <button mat-button type="button" (click)="setOutline(item)" style="direction: rtl; width: 100%; text-align: right; font-size:larger">{{item.name}}</button>
          </div>

        </mat-card>

      </div>
    </mat-sidenav>
    <mat-sidenav-content>
      <div class="pageNumberBoxBoundry">
        <div id="pageNumberBoxBoundry" style="position:absolute;height:100%;width:100%;">

          <div [hidden]="!loaded" #pageNumberBox class="pagenumber-box" cdkDragBoundary="#pageNumberBoxBoundry" cdkDrag cdkDragLockAxis="y"
               [cdkDragFreeDragPosition]="dragPosition"
               (cdkDragMoved)="pageNumberBoxMoved($event)">
            {{currentPageNumber}}
          </div>
        </div>
      </div>

      <div #viewerContainer id="viewerContainer" cdkScrollable [style.visibility]="loaded ? 'visible' : 'hidden'" (toggleFullScreen)="toggleFullScreen()"
           appQuranGestures (zoom)="zoom($event)" (endzoom)="endzoom($event)">
        <div id="viewer" class="pdfViewer">
          <div #page *ngFor="let page of pages; let index = index" class="page" data-loaded="false" [hidden]="index >= totalPages"></div>
        </div>
      </div>

    </mat-sidenav-content>


  </mat-sidenav-container>
</div>
<router-outlet></router-outlet>
